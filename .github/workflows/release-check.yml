name: Release check

# Installs a published release the way a new user does, on clean Windows, macOS and Linux machines, with the
# README's own commands: the bootstrap, fetched from this repository, finds the installer for the machine in the
# release, checks it against SHA256SUMS and installs. Then mini-AlbertCode reports its version, its service starts
# as `albert-mini` and `albert-mini web` start it, and the bootstrap uninstalls it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (default: the latest release)"
        required: false

permissions:
  contents: read

env:
  BOOTSTRAP: https://raw.githubusercontent.com/${{ github.repository }}/main/installer

jobs:
  install:
    name: New user on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-latest }
          - { name: macOS (Apple silicon), runner: macos-latest }
          - { name: macOS (Intel), runner: macos-15-intel }
          - { name: Windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: The release to check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAMED: ${{ inputs.tag }}
          WANTED: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="${WANTED:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          # A tag named by hand is installed by its version; otherwise the latest, as the README installs it.
          if [ -n "$NAMED" ]; then echo "PICK=--version ${tag#v}" >> "$GITHUB_ENV"; fi

      - name: Install, as on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "$BOOTSTRAP/install.sh" | sh -s -- --yes $PICK | tee install.txt
          grep -q "is ready" install.txt
          "$HOME/.local/bin/albert-mini" --version | tee version.txt
          grep -q "$VERSION" version.txt
      - name: The service starts as albert-mini starts it, on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mini="$HOME/.local/bin/albert-mini"
          if ! "$mini" sessions --json; then
            find "$HOME" -name backend.log -path '*mini-AlbertCode*' -exec tail -n 40 {} \; 2>/dev/null
            exit 1
          fi
          "$mini" status | tee status.txt
          grep -q '"ours": true' status.txt
          "$mini" stop
      - name: Uninstall, as on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "$BOOTSTRAP/install.sh" | sh -s -- --uninstall --yes | tee uninstall.txt
          grep -q "mini-AlbertCode is uninstalled." uninstall.txt
          test ! -e "$HOME/.local/bin/albert-mini"

      - name: Install, as on Windows (irm | iex)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MINI_ALBERTCODE_INSTALL_ARGS = "--yes $env:PICK".Trim()
          irm "$env:BOOTSTRAP/install.ps1" | iex
          $found = & "$env:USERPROFILE\.local\bin\albert-mini.exe" --version
          Write-Output $found
          if ($found -notmatch [regex]::Escape($env:VERSION)) { exit 1 }
      - name: The service starts as albert-mini starts it, on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mini = "$env:USERPROFILE\.local\bin\albert-mini.exe"
          & $mini sessions --json
          if ($LASTEXITCODE) {
            Get-Content "$env:LOCALAPPDATA\mini-AlbertCode SWE Agent\backend.log" -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          $status = & $mini status | Out-String
          Write-Output $status
          if ($status -notmatch '"ours": true') { exit 1 }
          & $mini stop
      - name: Uninstall, as on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MINI_ALBERTCODE_INSTALL_ARGS = '--uninstall --yes'
          irm "$env:BOOTSTRAP/install.ps1" | iex
          if (Test-Path "$env:USERPROFILE\.local\bin\albert-mini.exe") { exit 1 }
